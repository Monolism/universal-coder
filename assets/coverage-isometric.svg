<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Isometric bar chart of reference modules per engineering area">
  <defs>
    <pattern id="igrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#7c5cff" stroke-width="1" opacity="0.06"/>
    </pattern>
    <filter id="iglow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="400" fill="#060810"/>
  <rect width="900" height="400" fill="url(#igrid)"/>

  <text x="30" y="40" font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" letter-spacing="3" fill="#586080">REFERENCE MODULES / ENGINEERING AREA</text>

  <line x1="60" y1="320" x2="860" y2="320" stroke="#22d3ee" stroke-opacity="0.25"/>

  <!-- bar: Correctness & Safety = 3 -->
  <g>
    <polygon points="130,170 160,155 190,170 160,185" fill="#a78bff" opacity="0.9"/>
    <polygon points="130,170 160,185 160,320 130,305" fill="#7c5cff"/>
    <polygon points="160,185 190,170 190,305 160,320" fill="#5e3fe0"/>
    <text x="160" y="150" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#e9ecf8">3</text>
    <text x="160" y="345" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" letter-spacing="0.5" fill="#98a0bd">CORRECTNESS</text>
    <text x="160" y="358" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" letter-spacing="0.5" fill="#98a0bd">&amp; SAFETY</text>
  </g>

  <!-- bar: Scientific data = 3 -->
  <g>
    <polygon points="290,170 320,155 350,170 320,185" fill="#7ee8f7" opacity="0.9"/>
    <polygon points="290,170 320,185 320,320 290,305" fill="#22d3ee"/>
    <polygon points="320,185 350,170 350,305 320,320" fill="#139cb0"/>
    <text x="320" y="150" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#e9ecf8">3</text>
    <text x="320" y="345" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" letter-spacing="0.5" fill="#98a0bd">SCIENTIFIC</text>
    <text x="320" y="358" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" letter-spacing="0.5" fill="#98a0bd">DATA</text>
  </g>

  <!-- bar: Graph intelligence = 2 -->
  <g>
    <polygon points="450,220 480,205 510,220 480,235" fill="#ffd79a" opacity="0.9"/>
    <polygon points="450,220 480,235 480,320 450,305" fill="#ffb84d"/>
    <polygon points="480,235 510,220 510,305 480,320" fill="#cc8a2a"/>
    <text x="480" y="200" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#e9ecf8">2</text>
    <text x="480" y="345" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" letter-spacing="0.5" fill="#98a0bd">GRAPH</text>
    <text x="480" y="358" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" letter-spacing="0.5" fill="#98a0bd">INTELLIGENCE</text>
  </g>

  <!-- bar: Interfaces = 2 -->
  <g>
    <polygon points="610,220 640,205 670,220 640,235" fill="#ffb3c0" opacity="0.9"/>
    <polygon points="610,220 640,235 640,320 610,305" fill="#ff4d6d"/>
    <polygon points="640,235 670,220 670,305 640,320" fill="#c92e49"/>
    <text x="640" y="200" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#e9ecf8">2</text>
    <text x="640" y="345" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" letter-spacing="0.5" fill="#98a0bd">INTERFACES &amp;</text>
    <text x="640" y="358" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" letter-spacing="0.5" fill="#98a0bd">VISUALIZATION</text>
  </g>

  <!-- bar: Security research = 1 -->
  <g>
    <polygon points="770,270 800,255 830,270 800,285" fill="#c7cce3" opacity="0.9"/>
    <polygon points="770,270 800,285 800,320 770,305" fill="#98a0bd"/>
    <polygon points="800,285 830,270 830,305 800,320" fill="#707899"/>
    <text x="800" y="250" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#e9ecf8">1</text>
    <text x="800" y="345" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" letter-spacing="0.5" fill="#98a0bd">SECURITY</text>
    <text x="800" y="358" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" letter-spacing="0.5" fill="#98a0bd">RESEARCH</text>
  </g>

  <circle cx="800" cy="270" r="5" fill="#22d3ee" filter="url(#iglow)"/>
</svg>
